<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Link Created</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="header success">
            <h1>Link Created</h1>
            <p class="subtitle">Share this link with your customer. Expires {{ expires_at.strftime('%Y-%m-%d %H:%M UTC') }}. Max {{ max_views }} view(s).</p>
        </div>

        <div class="share-box">
            <label>Secure Link</label>
            <div class="copy-row">
                <input type="text" id="share_url" value="{{ share_url }}" readonly>
                <button onclick="copyLink()" class="btn-copy">Copy</button>
            </div>
            <p class="hint" id="copy_status"></p>
        </div>

        <div class="actions">
            <a href="/" class="btn-secondary">Create Another</a>
        </div>
    </div>

    <script>
    function copyLink() {
        var input = document.getElementById('share_url');
        input.select();
        input.setSelectionRange(0, 99999);

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(input.value).then(function() {
                showCopied();
            }).catch(function() {
                fallbackCopy(input);
            });
        } else {
            fallbackCopy(input);
        }
    }

    function fallbackCopy(input) {
        document.execCommand('copy');
        showCopied();
    }

    function showCopied() {
        document.getElementById('copy_status').textContent = 'Copied!';
        setTimeout(function() {
            document.getElementById('copy_status').textContent = '';
        }, 2000);
    }
    </script>
</body>
</html>
